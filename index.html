<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notready.com</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:#fff;
}

header{
  text-align:center;
  padding:30px 15px;
  border-bottom:1px solid #202638;
}

.logo{
  font-size:30px;
  font-weight:800;
}

header p{
  color:#8f98aa;
}

.container{
  max-width:950px;
  margin:35px auto;
  padding:0 16px;
}

.title{
  text-align:center;
  margin-bottom:25px;
}

.title h1{
  margin-bottom:8px;
}

.title p{
  color:#8f98aa;
}

.services{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}

.service{
  background:#111722;
  border:1px solid #252d3d;
  border-radius:16px;
  padding:22px;
  cursor:pointer;
  transition:.2s;
}

.service:hover,
.service.selected{
  border-color:#6366f1;
  transform:translateY(-2px);
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#20283a;
  color:#a5b4fc;
  font-size:11px;
}

.service h2{
  margin:16px 0 8px;
}

.service p{
  color:#8f98aa;
  font-size:14px;
}

.price{
  margin-top:18px;
  font-size:27px;
  font-weight:800;
}

.order{
  margin-top:25px;
  padding:24px;
  background:#111722;
  border:1px solid #252d3d;
  border-radius:16px;
}

label{
  display:block;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:14px;
  background:#080b12;
  color:white;
  border:1px solid #374151;
  border-radius:9px;
  outline:none;
}

input:focus{
  border-color:#6366f1;
}

.summary{
  margin-top:20px;
  padding:15px;
  background:#080b12;
  border-radius:10px;
  line-height:1.9;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:9px;
  background:#6366f1;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled
